name: CI - Caminhões API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Build e qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript - verificação de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build


  docker:
    name: Build e smoke test Docker
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker compose build

      - name: Subir aplicação e PostgreSQL
        run: docker compose up -d

      - name: Aguardar API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api postgres
          exit 1

      - name: Validar Swagger
        run: curl --fail --silent http://localhost:3000/api-docs.json > /dev/null

      - name: Encerrar containers
        if: always()
        run: docker compose down -v
